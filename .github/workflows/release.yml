name: Release

# Push a tag like v0.2.0 to build Canvas.app and attach Canvas-0.2.0.zip to a GitHub release, with
# libintl's source (gettext-0.24.tar.gz) and THIRD_PARTY_NOTICES.md (docs/releasing.md).
# With the signing secrets below the zip holds a Developer ID-signed, notarized and stapled app
# (scripts/notarize.sh); without them, an ad-hoc signed one, and the signed path runs as a dry run
# (ad hoc with the hardened runtime, nothing submitted) so it stays tested.
# Run it by hand (Actions › Release › Run workflow, or `gh workflow run release.yml`) to make the same
# zip from VERSION without publishing anything: it becomes the run's artifact.
#
# Secrets (Settings › Secrets and variables › Actions):
#   CANVAS_CERT_P12            base64 of the Developer ID Application certificate + key (.p12)
#   CANVAS_CERT_PASSWORD       the .p12's export password
# and notary credentials, an App Store Connect API key:
#   CANVAS_NOTARY_KEY          base64 of the key (AuthKey_<id>.p8)
#   CANVAS_NOTARY_KEY_ID       that key's id
#   CANVAS_NOTARY_ISSUER       the issuer id shown above the keys in App Store Connect
# or an app-specific password:
#   CANVAS_NOTARY_APPLE_ID     the Apple ID's email
#   CANVAS_NOTARY_PASSWORD     an app-specific password for it
#   CANVAS_NOTARY_TEAM_ID      the team id
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGNED: ${{ secrets.CANVAS_CERT_P12 != '' && (secrets.CANVAS_NOTARY_KEY != '' || secrets.CANVAS_NOTARY_PASSWORD != '') }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          version="$(cat VERSION)"
          # The clients and plugin carry VERSION (scripts/gen-clients.ts); the tag must match it.
          if [ "$PUBLISH" = true ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match VERSION $version" >&2
            exit 1
          fi
          echo "CANVAS_VERSION=$version" >> "$GITHUB_ENV"
          echo "CANVAS_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ZIP=Canvas-$version.zip" >> "$GITHUB_ENV"
      - name: Fetch libintl's source
        if: env.PUBLISH == 'true'
        # Canvas statically links GNU libintl (LGPL-2.1) inside libghostty, so every release carries
        # its source next to the zip (THIRD_PARTY_NOTICES.md, "GNU libintl"). GNU's copy first, then
        # the identical one Ghostty builds from.
        env:
          GETTEXT_SHA256: c918503d593d70daf4844d175a13d816afacb667c06fba1ec9dcd5002c1518b7
        run: |
          for url in https://ftp.gnu.org/gnu/gettext/gettext-0.24.tar.gz https://deps.files.ghostty.org/gettext-0.24.tar.gz; do
            if curl -fsSL --retry 3 -o gettext-0.24.tar.gz "$url" && echo "$GETTEXT_SHA256  gettext-0.24.tar.gz" | shasum -a 256 -c -; then
              exit 0
            fi
          done
          echo "no gettext-0.24.tar.gz with SHA-256 $GETTEXT_SHA256" >&2
          exit 1
      - name: Select Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CANVAS_CERT_P12: ${{ secrets.CANVAS_CERT_P12 }}
          CANVAS_CERT_PASSWORD: ${{ secrets.CANVAS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf %s "$CANVAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CANVAS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "no Developer ID Application identity in CANVAS_CERT_P12" >&2; exit 1; }
          echo "CANVAS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and zip
        if: env.SIGNED == 'true'
        env:
          CANVAS_NOTARY_KEY_BASE64: ${{ secrets.CANVAS_NOTARY_KEY }}
          CANVAS_NOTARY_KEY_ID: ${{ secrets.CANVAS_NOTARY_KEY_ID }}
          CANVAS_NOTARY_ISSUER: ${{ secrets.CANVAS_NOTARY_ISSUER }}
          CANVAS_NOTARY_APPLE_ID: ${{ secrets.CANVAS_NOTARY_APPLE_ID }}
          CANVAS_NOTARY_PASSWORD: ${{ secrets.CANVAS_NOTARY_PASSWORD }}
          CANVAS_NOTARY_TEAM_ID: ${{ secrets.CANVAS_NOTARY_TEAM_ID }}
        run: |
          if [ -n "$CANVAS_NOTARY_KEY_BASE64" ]; then
            export CANVAS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            trap 'rm -f "$CANVAS_NOTARY_KEY"' EXIT
            printf %s "$CANVAS_NOTARY_KEY_BASE64" | base64 --decode > "$CANVAS_NOTARY_KEY"
          fi
          scripts/notarize.sh "$ZIP"
      - name: Build and zip (ad hoc)
        if: env.SIGNED != 'true'
        run: |
          scripts/bundle.sh release
          # A terminal tile imports the SDK from the bundle; that must leave the signature intact.
          PYTHONPATH=.build/Canvas.app/Contents/Resources/clients/python python3 -c 'import canvas_sdk'
          codesign --verify --deep --strict .build/Canvas.app
          # As scripts/notarize.sh zips: no AppleDouble `._*` entries.
          ditto -c -k --norsrc --noextattr --noacl --keepParent .build/Canvas.app "$ZIP"
      - name: Dry run of the notarized build
        if: env.SIGNED != 'true'
        run: scripts/notarize.sh --dry-run "$RUNNER_TEMP/dry-run.zip"
      - name: Keep the zip
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made from a Mac (docs/releasing.md) pushes its tag with it: leave that one as is.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; not publishing this build's zip."
            # Its libintl source and notices still go up (the same files a Mac release attaches).
            gh release upload "$GITHUB_REF_NAME" gettext-0.24.tar.gz THIRD_PARTY_NOTICES.md --clobber
            exit 0
          fi
          # The version's CHANGELOG.md section, above GitHub's list of merged changes.
          scripts/release-notes.sh "$CANVAS_VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$ZIP" gettext-0.24.tar.gz THIRD_PARTY_NOTICES.md --title "Canvas $CANVAS_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
