name: Release

# Push a tag like v0.2.0 to build Chalkwork.app and attach Chalkwork-0.2.0.zip to a GitHub release, with
# libintl's source (gettext-0.24.tar.gz) and THIRD_PARTY_NOTICES.md.
# With the signing secrets below the zip holds a Developer ID-signed, notarized and stapled app;
# without them, an ad-hoc signed one (docs/releasing.md).
#
# Secrets (Settings › Secrets and variables › Actions):
#   CHALKWORK_CERT_P12            base64 of the Developer ID Application certificate + key (.p12)
#   CHALKWORK_CERT_PASSWORD       the .p12's export password
#   CHALKWORK_NOTARY_KEY          base64 of the App Store Connect API key (AuthKey_<id>.p8)
#   CHALKWORK_NOTARY_KEY_ID       that key's id
#   CHALKWORK_NOTARY_ISSUER       the issuer id shown above the keys in App Store Connect
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGNED: ${{ secrets.CHALKWORK_CERT_P12 != '' && secrets.CHALKWORK_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch libintl's source
        # Chalkwork statically links GNU libintl (LGPL-2.1) inside libghostty, so every release carries
        # its source next to the zip (THIRD_PARTY_NOTICES.md, "GNU libintl"). GNU's copy first, then
        # the identical one Ghostty builds from.
        env:
          GETTEXT_SHA256: c918503d593d70daf4844d175a13d816afacb667c06fba1ec9dcd5002c1518b7
        run: |
          for url in https://ftp.gnu.org/gnu/gettext/gettext-0.24.tar.gz https://deps.files.ghostty.org/gettext-0.24.tar.gz; do
            if curl -fsSL --retry 3 -o gettext-0.24.tar.gz "$url" && echo "$GETTEXT_SHA256  gettext-0.24.tar.gz" | shasum -a 256 -c -; then
              exit 0
            fi
          done
          echo "no gettext-0.24.tar.gz with SHA-256 $GETTEXT_SHA256" >&2
          exit 1
      - name: Select Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CHALKWORK_CERT_P12: ${{ secrets.CHALKWORK_CERT_P12 }}
          CHALKWORK_CERT_PASSWORD: ${{ secrets.CHALKWORK_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf %s "$CHALKWORK_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CHALKWORK_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "no Developer ID Application identity in CHALKWORK_CERT_P12" >&2; exit 1; }
          echo "CHALKWORK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build Chalkwork.app
        env:
          CHALKWORK_VERSION: ${{ github.ref_name }}
          CHALKWORK_BUILD: ${{ github.run_number }}
        run: |
          export CHALKWORK_VERSION="${CHALKWORK_VERSION#v}"
          # The clients and plugin carry VERSION (scripts/gen-clients.ts); the tag must match it.
          [ "$CHALKWORK_VERSION" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)" >&2; exit 1; }
          scripts/bundle.sh release
          # A terminal tile imports the SDK from the bundle; that must leave the signature intact.
          PYTHONPATH=.build/Chalkwork.app/Contents/Resources/clients/python python3 -c 'import chalkwork_sdk'
          codesign --verify --deep --strict .build/Chalkwork.app
      - name: Notarize and zip
        if: env.SIGNED == 'true'
        env:
          CHALKWORK_NOTARY_KEY_BASE64: ${{ secrets.CHALKWORK_NOTARY_KEY }}
          CHALKWORK_NOTARY_KEY_ID: ${{ secrets.CHALKWORK_NOTARY_KEY_ID }}
          CHALKWORK_NOTARY_ISSUER: ${{ secrets.CHALKWORK_NOTARY_ISSUER }}
        run: |
          export CHALKWORK_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$CHALKWORK_NOTARY_KEY"' EXIT
          printf %s "$CHALKWORK_NOTARY_KEY_BASE64" | base64 --decode > "$CHALKWORK_NOTARY_KEY"
          scripts/notarize.sh .build/Chalkwork.app "Chalkwork-${GITHUB_REF_NAME#v}.zip"
      - name: Zip (ad hoc)
        if: env.SIGNED != 'true'
        # As scripts/notarize.sh zips: no AppleDouble `._*` entries.
        run: ditto -c -k --norsrc --noextattr --noacl --keepParent .build/Chalkwork.app "Chalkwork-${GITHUB_REF_NAME#v}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made from a Mac (docs/releasing.md) pushes its tag with it: leave that one as is.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; not publishing this build's zip."
            # Its libintl source and notices still go up (the same files a Mac release attaches).
            gh release upload "$GITHUB_REF_NAME" gettext-0.24.tar.gz THIRD_PARTY_NOTICES.md --clobber
            exit 0
          fi
          # The version's CHANGELOG.md section, above GitHub's list of merged changes.
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "Chalkwork-${GITHUB_REF_NAME#v}.zip" gettext-0.24.tar.gz THIRD_PARTY_NOTICES.md --title "Chalkwork ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
